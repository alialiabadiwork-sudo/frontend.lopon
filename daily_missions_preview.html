<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماموریت‌های امروز سالن (Daily Missions) - لوپُن</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Medium.woff2') format('woff2');
    }
    body {
      font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 sm:p-8 flex items-center justify-center antialiased select-none">

  <div class="w-full max-w-md space-y-4">
    <!-- Notice Badge -->
    <div class="bg-orange-50 border border-orange-200 text-[#F47A20] text-xs font-bold px-4 py-2 rounded-2xl flex items-center justify-between">
      <span class="flex items-center gap-2">
        <i class="fa-solid fa-sparkles"></i>
        جایگزین بخش دسترسی‌های سریع در داشبورد
      </span>
      <span class="text-[10px] bg-white px-2 py-0.5 rounded-lg border border-orange-200">گام اول</span>
    </div>

    <!-- The Daily Missions Card Component -->
    <div class="bg-white rounded-3xl p-6 border-2 border-orange-200 shadow-xl space-y-5 relative overflow-hidden">
      <div class="absolute top-0 right-0 left-0 h-2 bg-gradient-to-r from-orange-400 via-[#F47A20] to-amber-500"></div>

      <!-- Header with Status -->
      <div class="pb-3.5 border-b border-slate-100 pt-1">
        <div class="flex items-center justify-between">
          <h2 class="font-black text-base text-slate-900 flex items-center gap-2.5">
            <span class="w-9 h-9 rounded-2xl bg-orange-100 text-[#F47A20] flex items-center justify-center text-sm shadow-xs">
              <i class="fa-solid fa-list-check"></i>
            </span>
            <span>ماموریت‌های امروز سالن</span>
          </h2>
          <span id="missionsCountBadge" class="text-xs font-black text-[#F47A20] bg-orange-50 px-3 py-1 rounded-full border border-orange-200 shadow-2xs">
            ۲ از ۴ انجام شده
          </span>
        </div>
        <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">
          لیست اقدامات ضروری روزانه برای جذب مشتری بیشتر و بهبود رتبه سالن:
        </p>

        <!-- Progress Bar -->
        <div class="w-full h-2.5 bg-slate-100 rounded-full mt-3 overflow-hidden p-0.5">
          <div id="missionsProgressBar" class="h-full bg-gradient-to-r from-orange-400 to-[#F47A20] rounded-full transition-all duration-300" style="width: 50%"></div>
        </div>
      </div>

      <!-- Interactive Checklist of the exact 4 tasks -->
      <div class="space-y-3 text-xs" id="missionsList">

        <!-- Task 1: بروزرسانی قیمت ها -->
        <div class="p-3.5 bg-emerald-50/60 rounded-2xl border border-emerald-200/80 flex items-center justify-between transition-all">
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" checked onchange="toggleMissionCheck(this)" class="w-4.5 h-4.5 accent-[#F47A20] rounded cursor-pointer">
            <div>
              <span class="text-slate-500 line-through text-xs font-bold block">بروزرسانی قیمت‌ها و تخفیف‌های فصلی</span>
              <span class="text-[10px] text-emerald-700">تغییر نرخ خدمات بر اساس کشش بازار</span>
            </div>
          </label>
          <span class="text-emerald-600 bg-white px-2.5 py-1 rounded-xl text-[10px] font-bold border border-emerald-200">
            انجام شد <i class="fa-solid fa-check text-[9px]"></i>
          </span>
        </div>

        <!-- Task 2: آپدیت کردن عکس ها -->
        <div class="p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-2xl border border-slate-200/80 flex items-center justify-between transition-all">
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" onchange="toggleMissionCheck(this)" class="w-4.5 h-4.5 accent-[#F47A20] rounded cursor-pointer">
            <div>
              <span class="text-slate-900 font-black text-xs block">آپدیت کردن عکس‌ها در گالری لوپُن</span>
              <span class="text-[10px] text-slate-400">آپلود حداقل ۳ نمونه‌کار باکیفیت جدید</span>
            </div>
          </label>
          <span class="text-orange-600 bg-white px-2.5 py-1 rounded-xl text-[10px] font-bold border border-orange-200">
            در انتظار <i class="fa-solid fa-arrow-left text-[9px]"></i>
          </span>
        </div>

        <!-- Task 3: پاسخ به نظرات -->
        <div class="p-3.5 bg-emerald-50/60 rounded-2xl border border-emerald-200/80 flex items-center justify-between transition-all">
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" checked onchange="toggleMissionCheck(this)" class="w-4.5 h-4.5 accent-[#F47A20] rounded cursor-pointer">
            <div>
              <span class="text-slate-500 line-through text-xs font-bold block">پاسخ به نظرات و بازخوردهای مراجعین</span>
              <span class="text-[10px] text-emerald-700">ثبت پاسخ صمیمانه به کامنت‌های دیروز</span>
            </div>
          </label>
          <span class="text-emerald-600 bg-white px-2.5 py-1 rounded-xl text-[10px] font-bold border border-emerald-200">
            انجام شد <i class="fa-solid fa-check text-[9px]"></i>
          </span>
        </div>

        <!-- Task 4: ارسال پیامک انبوه -->
        <div class="p-3.5 bg-slate-50 hover:bg-slate-100/80 rounded-2xl border border-slate-200/80 flex items-center justify-between transition-all">
          <label class="flex items-center gap-3 cursor-pointer flex-1">
            <input type="checkbox" onchange="toggleMissionCheck(this)" class="w-4.5 h-4.5 accent-[#F47A20] rounded cursor-pointer">
            <div>
              <span class="text-slate-900 font-black text-xs block">ارسال پیامک انبوه و بازگشت مشتریان</span>
              <span class="text-[10px] text-slate-400">کمپین تخفیف ۲۰٪ برای غایبین بیش از ۴۵ روز</span>
            </div>
          </label>
          <span class="text-orange-600 bg-white px-2.5 py-1 rounded-xl text-[10px] font-bold border border-orange-200">
            در انتظار <i class="fa-solid fa-arrow-left text-[9px]"></i>
          </span>
        </div>

      </div>

      <!-- Footer Info -->
      <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
        <span>وضعیت پیشرفت روزانه: ۵۰٪</span>
        <button onclick="alert('تمام ماموریت‌های روزانه با موفقیت بررسی و ذخیره شدند.')" class="px-3.5 py-1.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold cursor-pointer transition-colors shadow-xs">
          ثبت وضعیت روزانه
        </button>
      </div>
    </div>
  </div>

  <script>
    function toggleMissionCheck(cb) {
      const parent = cb.closest('div.p-3\\.5');
      const textSpan = parent.querySelector('span.text-xs');
      const badge = parent.querySelector('span.rounded-xl');

      if (cb.checked) {
        textSpan.classList.add('line-through', 'text-slate-500');
        textSpan.classList.remove('text-slate-900', 'font-black');
        parent.classList.add('bg-emerald-50/60', 'border-emerald-200/80');
        parent.classList.remove('bg-slate-50', 'border-slate-200/80');
        badge.className = 'text-emerald-600 bg-white px-2.5 py-1 rounded-xl text-[10px] font-bold border border-emerald-200';
        badge.innerHTML = 'انجام شد <i class="fa-solid fa-check text-[9px]"></i>';
      } else {
        textSpan.classList.remove('line-through', 'text-slate-500');
        textSpan.classList.add('text-slate-900', 'font-black');
        parent.classList.remove('bg-emerald-50/60', 'border-emerald-200/80');
        parent.classList.add('bg-slate-50', 'border-slate-200/80');
        badge.className = 'text-orange-600 bg-white px-2.5 py-1 rounded-xl text-[10px] font-bold border border-orange-200';
        badge.innerHTML = 'در انتظار <i class="fa-solid fa-arrow-left text-[9px]"></i>';
      }

      const allCbs = document.querySelectorAll('#missionsList input[type="checkbox"]');
      const checkedCbs = document.querySelectorAll('#missionsList input[type="checkbox"]:checked');
      const percent = Math.round((checkedCbs.length / allCbs.length) * 100);
      document.getElementById('missionsProgressBar').style.width = percent + '%';
      document.getElementById('missionsCountBadge').innerText = checkedCbs.length + ' از ' + allCbs.length + ' انجام شده';
    }
  </script>
</body>
</html>
